apply plugin: 'com.android.application'

// Optional release signing. Reads app/keystore.properties if it exists, so the
// build works out of the box (producing an unsigned release APK) and starts
// signing as soon as the developer drops in their keystore - no build file
// edit needed, and no secret is ever committed.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.saad.capvid'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.saad.capvid"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"

        ndk {
            // Both ABIs: arm64-v8a for essentially every phone sold since 2017,
            // armeabi-v7a for the older 32-bit devices still in circulation.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Deliberately not minified: R8 would strip the JNI entry points and
            // the reflectively-inflated custom Views unless a keep file is added
            // first. Turn this on only together with proguard-rules.pro.
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    testOptions {
        unitTests {
            // android.graphics.Color is a stub in the mockable android.jar; the
            // caption tests assert on layout, timing and ASS structure, not on
            // colour values, so returning defaults is what they need.
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
        warningsAsErrors false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7'
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    // CameraX - Record Video screen
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-video:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // The caption layout/ASS tests run on the plain JVM - no Robolectric needed,
    // which keeps them fast enough to gate every CI build.
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
