name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Capvid
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages from the pre-installed SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Fetch whisper.cpp source for the native build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/cpp/whisper
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/capvid-assemble.log
          if ! gradle :app:assembleDebug --stacktrace --console=plain >"$log" 2>&1; then
            summary=$(grep -E 'FAILURE|What went wrong|Execution failed|error:|ERROR|Could not|A problem occurred|e: |w: ' "$log" | tail -100 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/:/%3A/g; s/,/%2C/g')
            echo "::error title=Gradle assemble failure::$summary"
            tail -120 "$log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -80 "$log"

      - name: Run JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/capvid-test.log
          if ! gradle :app:test --stacktrace --console=plain >"$log" 2>&1; then
            summary=$(tail -120 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/:/%3A/g; s/,/%2C/g')
            echo "::error title=Gradle test failure::$summary"
            tail -120 "$log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -80 "$log"

      - name: Create API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd \
            --name capvid-api-35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd capvid-api-35 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > /tmp/capvid-emulator.log 2>&1 &
          adb wait-for-device
          until adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '1'; do sleep 2; done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run instrumented tests
        run: gradle :app:connectedAndroidTest --stacktrace
